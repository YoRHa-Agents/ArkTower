name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check arktower/ --select F

      - name: Test
        run: python -m pytest tests/ -x -q --tb=short

      - name: Coverage
        run: python -m pytest tests/ --cov=arktower --cov-report=term-missing --cov-fail-under=60

      - name: Self-evaluation
        run: python -m arktower.evaluation.runner
