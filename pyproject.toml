[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arktower"
version = "0.1.0"
description = "ArkTower – hierarchical task management with MCP integration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "nicegui>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "mypy",
    "ruff",
]

[project.scripts]
arktower = "arktower.cli.app:app"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
