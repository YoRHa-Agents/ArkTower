<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; }
      .box { fill: none; stroke: #555; stroke-width: 1; }
      .box-fill { fill: #1a1a1a; stroke: #555; stroke-width: 1; }
      .accent { fill: #C7372F; }
      .label { fill: #DAD4BB; font-size: 13px; }
      .sublabel { fill: #A89F8A; font-size: 11px; }
      .dim { fill: #8A8172; font-size: 10px; }
      .connector { stroke: #555; stroke-width: 1; stroke-dasharray: 4,3; }
      .solid-conn { stroke: #555; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="480" fill="#0D0D0D"/>
  
  <!-- Outer frame -->
  <rect x="30" y="20" width="640" height="440" class="box"/>
  <text x="50" y="15" class="dim" font-size="9" letter-spacing="1">[ARCHITECTURE]</text>
  
  <!-- Layer 1: External Consumers -->
  <rect x="50" y="35" width="600" height="50" class="box-fill"/>
  <text x="350" y="55" text-anchor="middle" class="accent" font-size="11" letter-spacing="1">[EXTERNAL CONSUMERS]</text>
  <text x="350" y="72" text-anchor="middle" class="sublabel">Cursor (MCP)  |  OpenClaw  |  REST API  |  Dashboard  |  CLI</text>
  
  <!-- Connectors L1 &#x2192; L2 -->
  <line x1="140" y1="85" x2="140" y2="110" class="solid-conn"/>
  <line x1="280" y1="85" x2="280" y2="110" class="solid-conn"/>
  <line x1="420" y1="85" x2="420" y2="110" class="solid-conn"/>
  <line x1="540" y1="85" x2="540" y2="110" class="solid-conn"/>
  
  <!-- Layer 2: Interface boxes -->
  <rect x="60" y="110" width="140" height="55" class="box-fill"/>
  <text x="130" y="135" text-anchor="middle" class="accent" font-size="12">MCP Server</text>
  <text x="130" y="152" text-anchor="middle" class="dim">(stdio)</text>
  
  <rect x="215" y="110" width="140" height="55" class="box-fill"/>
  <text x="285" y="135" text-anchor="middle" class="accent" font-size="12">REST API</text>
  <text x="285" y="152" text-anchor="middle" class="dim">(FastAPI)</text>
  
  <rect x="370" y="110" width="110" height="55" class="box-fill"/>
  <text x="425" y="135" text-anchor="middle" class="accent" font-size="12">CLI</text>
  <text x="425" y="152" text-anchor="middle" class="dim">(Typer)</text>
  
  <rect x="495" y="110" width="140" height="55" class="box-fill"/>
  <text x="565" y="135" text-anchor="middle" class="accent" font-size="12">NiceGUI</text>
  <text x="565" y="152" text-anchor="middle" class="dim">Dashboard</text>
  
  <!-- Connectors L2 &#x2192; L3 -->
  <line x1="130" y1="165" x2="130" y2="200" class="connector"/>
  <line x1="285" y1="165" x2="285" y2="200" class="connector"/>
  <line x1="425" y1="165" x2="425" y2="200" class="connector"/>
  <line x1="565" y1="165" x2="565" y2="200" class="connector"/>
  <line x1="130" y1="200" x2="565" y2="200" class="connector"/>
  <line x1="350" y1="200" x2="350" y2="215" class="solid-conn"/>
  
  <!-- Layer 3: Task Service -->
  <rect x="180" y="215" width="210" height="50" class="box-fill"/>
  <text x="285" y="245" text-anchor="middle" class="accent" font-size="14">Task Service</text>
  <line x1="390" y1="240" x2="460" y2="240" class="solid-conn" marker-end="none"/>
  <text x="395" y="237" class="sublabel" font-size="11">&#x2192; EventBus (pub/sub)</text>
  
  <!-- Connector L3 &#x2192; L4 -->
  <line x1="285" y1="265" x2="285" y2="295" class="connector"/>
  
  <!-- Layer 4: State Machine -->
  <rect x="180" y="295" width="210" height="50" class="box-fill"/>
  <text x="285" y="325" text-anchor="middle" class="accent" font-size="14">State Machine</text>
  <text x="425" y="325" class="sublabel" font-size="11">15 triggers &#xD7; 10 states</text>
  
  <!-- Connector L4 &#x2192; L5 -->
  <line x1="285" y1="345" x2="285" y2="375" class="connector"/>
  
  <!-- Layer 5: SQLite -->
  <rect x="180" y="375" width="210" height="50" class="box-fill"/>
  <text x="285" y="405" text-anchor="middle" class="accent" font-size="14">SQLite (WAL mode)</text>
  <text x="425" y="405" class="sublabel" font-size="11">FTS5 &#xB7; JSON1 &#xB7; Indexes</text>
  
  <!-- Frame label -->
  <text x="350" y="458" text-anchor="middle" class="dim" font-size="9" letter-spacing="1">ArkTower Core Process</text>
</svg>
