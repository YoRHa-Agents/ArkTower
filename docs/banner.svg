<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect width="800" height="200" fill="#0D0D0D"/>
  <rect x="1" y="1" width="798" height="198" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Red accent line -->
  <line x1="250" y1="50" x2="550" y2="50" stroke="#C7372F" stroke-width="2"/>
  
  <!-- Main title -->
  <text x="400" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="56" font-weight="bold" letter-spacing="12">
    <tspan fill="#DAD4BB">ARK</tspan><tspan fill="#C7372F">TOWER</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#A89F8A" letter-spacing="4">
    ®  AGENT-ORIENTED TASK POOL SYSTEM  ®
  </text>
  
  <!-- Bottom accent line -->
  <line x1="250" y1="160" x2="550" y2="160" stroke="#333" stroke-width="1"/>
  
  <!-- Classification badge -->
  <text x="760" y="25" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#8A8172" letter-spacing="1">
    [SYSTEM ACTIVE]
  </text>
  
  <!-- Version -->
  <text x="40" y="185" font-family="'Courier New', monospace" font-size="9" fill="#8A8172" letter-spacing="1">
    v0.1.0
  </text>
  
  <!-- Corner decorations -->
  <line x1="20" y1="20" x2="40" y2="20" stroke="#C7372F" stroke-width="1"/>
  <line x1="20" y1="20" x2="20" y2="40" stroke="#C7372F" stroke-width="1"/>
  <line x1="760" y1="180" x2="780" y2="180" stroke="#C7372F" stroke-width="1"/>
  <line x1="780" y1="160" x2="780" y2="180" stroke="#C7372F" stroke-width="1"/>
</svg>
